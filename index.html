<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algo-vis</title>
    <!-- google font here -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <!-- css link here -->
     <link rel="stylesheet" href="./common_style/header.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
   
<div id="header-placeholder"></div>

    <main>

        <div class="overlay-menu">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">Problems</a></li>
                <li><a href="">Article</a></li>
                <li> <a href="">Menu</a></li>
            </ul>

        </div>

        <section class="hero-section">
            <div class="hero-container">
                <div class="hero-contain">
                    <ul>
                        <li><span>●</span>Free · No sign-up required</li>
                    </ul>

                    <div class="shadow"></div>
                    <div class="hero-main">

                        <div class="hero-details">
                            <h1>Master Algorithms <span>Visually</span></h1>

                            <p>Step-by-step animated visualizations for LeetCode problems and classic
                                algorithms. Built for
                                coding interviews and CS learners.</p>
                        </div>

                        <div class="btn-group">
                            <button class="primary-btn btn">Browse All Problems <span><svg
                                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                        stroke-width="1.5" stroke="currentColor" class="size-6">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3" />
                                    </svg>
                                </span></button>
                            <button class="secondary-btn btn">Try Two Sum</button>
                        </div>

                        <div class="hero-feature">
                            <div class="problem">
                                <p class="stat-count space-grotesk">25+</p>
                                <p>Algorithms</p>
                            </div>

                            <div class="language">
                                <p class="stat-language">3</p>
                                <p>Language</p>
                            </div>

                            <div class="stat-badge">
                                <p class="stat-number">100%</p>
                                <p>Free</p>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>



        <div id="problem-card-placeholder"></div>


    </main>
    <script src="./index.js"></script>
</body>

</html>
